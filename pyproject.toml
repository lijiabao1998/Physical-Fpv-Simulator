[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpvsim"
version = "0.1.0"
description = "Physics-first FPV quadcopter simulator that follows a real R&D workflow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpvsim = "fpvsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
