# Version B: camera on the front of the top plate, battery moved back to rebalance.
schema = "fpvsim.build/1"

[meta]
extends = "ref-5in-6s-freestyle.toml"
id = "ref-5in-6s-freestyle-actioncam-b"
name = "版本 B：相機裝在上板前端、電池後移"
description = "參考機加掛全尺寸運動相機，相機座鎖在上板前端，電池往後移 20 mm 讓重心回到推力中心附近；相機位置也比版本 A 低。相機座寬度限制在 40 mm，避開前槳的槳盤範圍。"
change = "加掛全尺寸運動相機（上板前端），電池後移 20 mm"

[[parts]]
name = "battery"
uses = "battery"
position = { value = [-20, 0, -46], unit = "mm" }
position_u = { value = [4, 2, 1], unit = "mm", source = "estimate", note = "用綁帶固定，每次裝電池的位置都略有不同" }

[[parts]]
name = "action_camera"
component = "../components/payloads/generic-action-camera-full.toml"
# in front of the battery on the top plate (top surface z = -27 mm), on an 8 mm mount
position = { value = [36, 0, -60.5], unit = "mm" }
position_u = { value = [2, 1, 1], unit = "mm", source = "estimate", note = "鎖在上板的相機座，位置比綁帶固定準確" }

[[parts]]
name = "camera_mount"
group = "payload"
mass = { value = 12, unit = "g", source = "estimate", u = 3, note = "TPU 相機座，寬 40 mm 以避開前槳槳盤" }
shape = { type = "box", size = [34, 40, 8], unit = "mm" }
position = { value = [36, 0, -31], unit = "mm" }
