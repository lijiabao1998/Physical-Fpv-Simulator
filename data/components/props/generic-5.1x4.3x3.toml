# Generic 5.1 x 4.3 inch tri-blade prop: the class average of public static thrust-stand data,
# not any one product. Ct(J), Cp(J) and their Reynolds-number trend are fitted to the cited points in
# data/validation/props-5in-tri.toml (`fpvsim validate-prop` reproduces every number below);
# the spread between products and test rigs is the uncertainty. Measuring the actual prop on a
# thrust stand (`fpvsim fit-prop`) replaces all of it.
schema = "fpvsim.component/1"

mass = { value = 4.3, unit = "g", source = "estimate", u = 0.3 }
cg_offset = { value = [0, 0, -24], unit = "mm" }

[meta]
id = "generic-5.1x4.3x3"
category = "prop"
name = "通用 5.1×4.3 三葉槳"

[config]
blades = 3

[params]
diameter = { value = 5.1, unit = "in", source = "nominal" }
pitch = { value = 4.3, unit = "in", source = "nominal", note = "75% 半徑處的幾何螺距，模型視為等螺距" }
spin_inertia = { value = 4900, unit = "g*mm^2", source = "estimate", u_rel = 0.30, note = "三片葉片共約 3.5 g，以均勻細桿 (1/3) m R² 估算" }
flap_fraction = { value = 0.5, unit = "1", source = "estimate", u = 0.2886, dist = "uniform", note = "槳葉在前飛時的揮舞程度：0 = 剛性葉片（前進側多出的升力全部變成槳轂滾轉力矩），1 = 自由揮舞（槳盤後傾，部分推力變成槳盤阻力）。塑膠槳介於兩者之間，沒有數據前取 0 到 1 的均勻分布。應以風洞量測槳在斜向氣流中的 H 力辨識（fpvsim fit-tunnel）" }

[coefficients]
source = "derived"
ref = "fpvsim validate-prop：data/validation/props-5in-tri.toml"
note = "這一類槳在 Re75 = 6×10⁴ 的係數：靜態 Ct 為 5 組公開推力台數據（4 款槳、3 種推力台）的平均，靜態 FM（因而 Cp）為其中 3 組有扭矩的數據（3 款槳，同一台推力台）的平均，Ct(J)、Cp(J) 的形狀取自 UIUC 兩款 5 吋三葉槳的風洞數據（以 J/(P/D) 對齊）；不確定度為新的一款槳相對於這一類平均的預測標準差，加上推力台之間的系統誤差"
J = [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]
ct = [0.1714, 0.1698, 0.1681, 0.1624, 0.1564, 0.1496, 0.1424, 0.1328, 0.1228, 0.1124, 0.1014, 0.0892, 0.0762, 0.0629, 0.0487, 0.0331, 0.0177, 0.0022]
cp = [0.0971, 0.0971, 0.0970, 0.0946, 0.0919, 0.0894, 0.0867, 0.0831, 0.0792, 0.0750, 0.0707, 0.0656, 0.0601, 0.0544, 0.0478, 0.0406, 0.0332, 0.0257]
ct_u_rel = 0.112
fm_u_rel = 0.065  # figure of merit; Cp follows from Ct and FM (correlated thrust and power errors)

[reynolds]
source = "derived"
ref = "fpvsim validate-prop：data/validation/props-5in-tri.toml"
note = "Ct 與 FM 隨葉片雷諾數 Re75 = Ω (0.75 R) c75 / ν 的冪次律（c75 取槳葉幾何在 75% 半徑的弦長 10 mm）。指數為 6 組數據（Ct）與 4 組有扭矩的數據（FM）各自趨勢的平均，不確定度為一款新槳的預測標準差；在數據範圍外保持邊界值"
re_ref = 60000
re_min = 24400  # Ct: range of the thrust readings
re_max = 100400
fm_re_min = 24400  # FM: range of the thrust-and-torque readings
fm_re_max = 88500
ct_exponent = { value = 0.095, unit = "1", source = "derived", u = 0.048, ref = "data/validation/props-5in-tri.toml", note = "Ct ∝ Re^n：低雷諾數時層流分離使葉片升力下降" }
fm_exponent = { value = 0.241, unit = "1", source = "derived", u = 0.058, ref = "data/validation/props-5in-tri.toml", note = "FM ∝ Re^n：低雷諾數時型阻上升、升力下降，懸停效率比滿油門低約兩成" }

[bemt]
# blade geometry for the oblique-flow model (rotor_ff.py) only: it supplies how thrust, torque and
# in-plane loads change with edgewise and off-design flow, anchored to the [coefficients] curves above
hub_radius = { value = 6, unit = "mm", source = "estimate" }

[bemt.blade]
source = "estimate"
note = "高弦長 freestyle 槳的典型弦長分布估計；應以槳葉掃描或卡尺量測取代"
r_over_R = [0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95, 1.00]
chord = [9.0, 11.5, 12.5, 12.5, 12.0, 11.0, 10.0, 8.5, 6.5, 4.0]
chord_unit = "mm"

[bemt.airfoil]
cl_alpha = { value = 5.7, unit = "1/rad", source = "estimate", note = "約 0.9 × 2π，薄翼型在低雷諾數下的升力斜率" }
alpha0 = { value = -4, unit = "deg", source = "estimate", note = "有彎度薄翼型的零升力攻角" }
cl_max = { value = 1.2, unit = "1", source = "estimate" }
cl_min = { value = -0.5, unit = "1", source = "estimate" }
cd_min = { value = 0.030, unit = "1", source = "estimate", note = "雷諾數 3×10⁴–10⁵ 的量級，參考低速翼型風洞文獻（如 UIUC Low-Speed Airfoil Tests）" }
cl_cd_min = { value = 0.4, unit = "1", source = "estimate" }
k_cd = { value = 0.04, unit = "1", source = "estimate" }
