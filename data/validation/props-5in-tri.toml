# 5 吋三葉槳的公開靜態推力台數據點：通用 5.1×4.3×3 槳的校正與驗證資料。
#
# 方法學 §7：規格書與公開測試的數值是事實資訊，可以個別引用，但每一點都要附出處，
# 而且不轉錄整份資料表。這裡每個測試只取 3–4 個轉速點（原始表有 4–20 點），
# 每一點都標明來源網址與它在原始資料中的位置；品牌與型號只用來標示受測物，
# 零件庫裡沒有任何品牌零件。
#
# 數值照原始資料的單位與有效位數記錄；Ct、Cp、FM、雷諾數由 fpvsim.prop_validation 計算，
# 用法見 `fpvsim validate-prop` 與 docs/models.md。
schema = "fpvsim.validation/1"

[meta]
id = "props-5in-tri"
name = "5 吋三葉槳靜態推力台公開數據"
description = "5.0–5.1 吋、螺距 4.3 吋（P/D 0.84–0.86）的三葉槳，加上一組學術推力台數據（只用於雷諾數趨勢）"
retrieved = "2026-10-14"
re_ref = 60000  # 參考雷諾數：數據在對數尺度上的中心，讓等級與趨勢的擬合誤差幾乎不相關
chord75 = { value = 10, unit = "mm", note = "以通用槳估計弦長（75% 半徑處）定義 Re75 = Ω (0.75 R) c75 / ν；同一類槳都用這個值，所以 Re 實際上是換算後的轉速" }
rig_u_rel = 0.05  # 推力台之間的系統誤差 (1σ)，見下方 rig_note
rig_note = "同一款槳在兩台獨立推力台上：HQ 5x4.3x3 的 Ct 在 Tyto（Rob Hessler）比 MiniQuadTestBench 高約 3.5%；唯一的學術扭矩數據（NeuroBEM）的 FM 比資料庫的平均低約 6%（槳不同）。Tyto 資料庫另有一台（Julien Lariviere-Chartier）量同一款 5.1×5 槳，Ct 低 28%、FM 低 30%，與另外兩個來源都不符，判定為該台異常（不屬本類，未收錄）。據此取 5%。"

