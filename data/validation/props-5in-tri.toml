# ------------------------------------------------------------------ 前進比的形狀（有風速的推力台）
# 上面的數據都是靜態（J = 0）。Ct、Cp 隨前進比 J 的變化取自 UIUC 兩款 5 吋三葉槳的風洞數據：
# 各以同轉速的靜態值正規化，橫軸用 x = J / (P/D)（螺距不同的同類槳，形狀以 J/(P/D) 對齊）。
# 每個檔案只取隔列的數據點（約一半），靜態值由靜態檔中夾住該轉速的兩列內插。
# UIUC 的轉速只有約 6000 rpm（Re75 約 2 萬），所以只用它的「形狀」，等級仍來自上面的靜態數據。

