name: Battery research checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-data-lock.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-data-lock.txt
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Compute exact raw-input manifest key
        id: raw-key
        run: |
          raw_cache_key=$(python scripts/verified_raw_cache.py key)
          echo "key=$raw_cache_key" >> "$GITHUB_OUTPUT"
      - name: Restore exact raw-input bundle
        id: raw-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fpv-raw-v1/bundle.zip
          key: ${{ steps.raw-key.outputs.key }}
      - name: Verify and install complete cached inputs
        if: steps.raw-cache.outputs.cache-hit == 'true'
        run: python scripts/verified_raw_cache.py restore
      - name: Fetch checksum-pinned public data on cache miss
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/log_raw_source_requests.py chen
          python scripts/log_raw_source_requests.py thermal
          python scripts/log_raw_source_requests.py stanford
      - name: Rehash every raw input before consumption
        run: python scripts/verified_raw_cache.py verify
      - name: Prepare complete verified raw-input bundle
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: python scripts/verified_raw_cache.py pack
      - name: Persist verified raw-input bundle
        if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fpv-raw-v1/bundle.zip
          key: ${{ steps.raw-key.outputs.key }}
      - name: Inspect verified public data
        run: |
          physical-fpv thermal-inspect
          python scripts/inspect_stanford_pilot.py
      - name: Unit and physical-invariant tests
        run: pytest -q
      - name: Record full DFN numerical and empirical benchmark
        run: |
          physical-fpv benchmark --out results/dfn
          cat results/dfn/report.md >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; r=json.load(open('results/dfn/report.json')); assert r['numerical_gate_passed'], 'Numerical gate failed'"
      - name: Verify analytical materials method
        run: physical-fpv material-method-check > results/material-method.json
      - name: Upload reproducible research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-research-evidence
          path: results/
          if-no-files-found: warn
          retention-days: 14

