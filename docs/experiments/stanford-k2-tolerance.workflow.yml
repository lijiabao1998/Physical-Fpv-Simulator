# Inert review template: this file is outside .github/workflows.
# Copy only after final protocol/resource review and explicit launch coordination.
name: K2 fixed-mesh tolerance diagnostic 20261009 v1
on:
  push:
    branches: [battery/research-core-v1]
    paths: [.github/workflows/k2-tolerance-20261009-v1.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: k2-tolerance-20261009-v1-singleton
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PHYSICAL_FPV_RESEARCH_COMMIT: ${{ github.sha }}
    steps:
      - name: Reject every retry and earlier launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import json, os, urllib.request
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          url = base + '/actions/workflows/k2-tolerance-20261009-v1.yml/runs?per_page=100'
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          assert data['total_count'] == 1, 'No repeat scientific execution'
          assert len(data['workflow_runs']) == 1
          assert str(data['workflow_runs'][0]['id']) == os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the existing pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-data-lock.txt
      - name: Prepare complete inputs and build configurations without solving
        run: python scripts/run_stanford_k2_tolerance.py prepare --out results/k2-low-rate-model/inputs
      - name: Persist inputs before scientific execution
        id: input_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k2-low-rate-model-inputs-${{ github.run_id }}
          path: results/k2-low-rate-model/inputs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Verify the input artifact belongs to this execution
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_ID: ${{ steps.input_upload.outputs.artifact-id }}
          INPUT_ARTIFACT_DIGEST: ${{ steps.input_upload.outputs.artifact-digest }}
        run: python scripts/verify_managed_input_artifact.py
      - name: Exactly one mesh80 DFN under a 1200-second budget
        run: python -u scripts/run_stanford_k2_tolerance.py execute --prepared results/k2-low-rate-model/inputs --upload-receipt results/k2-low-rate-model/upload-receipt.json --out results/k2-low-rate-model/evidence
      - name: Compare saved tolerance evidence even after a physical audit failure
        if: always()
        run: |
          if test -f results/k2-low-rate-model/evidence/mesh80/report.json; then
            python scripts/compare_stanford_k2_tolerance.py results/k2-low-rate-model/evidence
          else
            echo "No complete mesh80 report; diagnostic remains UNVERIFIED"
            exit 1
          fi
      - name: Preserve complete or partial evidence regardless of scientific verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k2-low-rate-model-evidence-${{ github.run_id }}
          path: results/k2-low-rate-model/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
