name: Current-source bounded replay 20261009
on:
  push:
    branches: [battery/research-core-v1]
    paths: [.github/workflows/current-source-replay-20261009.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: current-source-replay-20261009-singleton
  cancel-in-progress: false
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [k1, thermal]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PHYSICAL_FPV_RESEARCH_COMMIT: ${{ github.sha }}
      REPLAY_CASE: ${{ matrix.case }}
    steps:
      - name: Reject retries and any earlier launch of this unique workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "REPLAY_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/current-source-replay-20261009.yml/runs?per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          assert data['total_count'] == 1, 'Any earlier launch requires a new reviewed protocol, not an automatic retry'
          assert len(data['workflow_runs']) == 1 and str(data['workflow_runs'][0]['id']) == os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing pinned research dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-data-lock.txt
      - name: Reacquire only the existing checksum-pinned k1 sources
        if: matrix.case == 'k1'
        run: python scripts/inspect_stanford_pilot.py --fetch --out results/source-inspection
      - name: Authenticate source delta and prepare durable inputs without solving
        run: python scripts/prepare_current_source_replay.py --case "$REPLAY_CASE" --out "results/current-source-replay/$REPLAY_CASE-inputs"
      - name: Persist all authenticated inputs before any scientific launch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          include-hidden-files: true
          name: current-source-${{ matrix.case }}-inputs-${{ github.run_id }}
          path: results/current-source-replay/${{ matrix.case }}-inputs/
          if-no-files-found: error
          retention-days: 90
      - name: Exactly one scientific solve within 1200 seconds and 4 GB
        shell: bash
        run: |
          test "$(($(date +%s) - REPLAY_JOB_STARTED_AT))" -le 180
          out="results/current-source-replay/$REPLAY_CASE"
          test ! -e "$out"
          mkdir -p "$out"
          start=$(date -u +%FT%TZ)
          printf '{"run_id":"%s","source_commit":"%s","case":"%s","started_at":"%s","scientific_solve_limit":1,"wall_limit_s":1200,"address_space_limit_bytes":4000000000}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$REPLAY_CASE" "$start" > "$out/launch.json"
          if test "$REPLAY_CASE" = k1; then
            command=(python -u scripts/run_stanford_pilot.py --timeout 1200 --out "$out")
          else
            command=(python -u scripts/verify_thermal_grid.py --mesh 120 --timeout 1200 --out "$out")
          fi
          set +e
          (ulimit -v 3906250 && timeout --signal=TERM --kill-after=5s 1200s "${command[@]}")
          code=$?
          set -e
          printf '{"run_id":"%s","source_commit":"%s","case":"%s","started_at":"%s","finished_at":"%s","exit_code":%s}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$REPLAY_CASE" "$start" "$(date -u +%FT%TZ)" "$code" > "$out/external-exit.json"
          exit "$code"
      - name: Preserve complete or partial evidence and input manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-source-${{ matrix.case }}-evidence-${{ github.run_id }}
          path: |
            results/current-source-replay/${{ matrix.case }}/
            results/current-source-replay/${{ matrix.case }}-inputs/manifest.json
            results/source-inspection/
          if-no-files-found: warn
          retention-days: 90
