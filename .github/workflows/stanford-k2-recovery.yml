name: Stanford k2 explicit recovery 20261009
on:
  push:
    branches: [battery/research-core-v1]
    paths: [.github/workflows/stanford-k2-recovery.yml]
permissions:
  contents: read
concurrency:
  group: stanford-k2-recovery-singleton
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PHYSICAL_FPV_RESEARCH_COMMIT: ${{ github.sha }}
    steps:
      - name: Reject manual reruns of this one-window recovery
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-data-lock.txt
      - name: Validate software before acquisition
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          pytest -q
      - name: Reacquire only the original checksum-pinned k2 source
        timeout-minutes: 2
        run: python scripts/acquire_stanford_k2_recovery.py
      - name: Static frozen-input verification
        run: |
          pytest -q tests/test_stanford_k2.py -m data
          python scripts/run_stanford_k2.py --preflight-only --stage-budget 120 --out results/stanford-k2-recovery-preflight
      - name: Persist inputs before starting numerical execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stanford-k2-recovery-inputs-${{ github.run_id }}
          path: |
            results/stanford-k2-recovery-acquisition/
            results/stanford-k2-recovery-preflight/
            data/stanford/raw/NMC_k2_1C_25degC.xlsx
            docs/stanford-k2-recovery-20261009.md
          if-no-files-found: error
          retention-days: 90
      - name: New 80 to 120 reproduction under one 1200-second budget
        shell: bash
        run: |
          mkdir -p results/stanford-k2-recovery
          printf '{"run_id":"%s","commit":"%s","status":"starting","original_attempt":"unknown","reuses_old_mesh80":false}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > results/stanford-k2-recovery/launch.json
          start=$(date -u +%FT%TZ)
          set +e
          timeout --signal=TERM --kill-after=5s 1200s python -u scripts/run_stanford_k2.py --stage-budget 1200 --out results/stanford-k2-recovery
          code=$?
          set -e
          printf '{"started_at":"%s","finished_at":"%s","exit_code":%s,"run_id":"%s","commit":"%s","original_attempt":"unknown"}\n' "$start" "$(date -u +%FT%TZ)" "$code" "$GITHUB_RUN_ID" "$GITHUB_SHA" > results/stanford-k2-recovery/external-exit.json
          exit "$code"
      - name: Preserve complete or partial receipts and scientific failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stanford-k2-recovery-evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
