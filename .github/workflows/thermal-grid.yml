name: Representative thermal convergence
on:
  pull_request:
    paths:
      - src/physical_fpv/core.py
      - scripts/verify_thermal_grid.py
      - scripts/grid_evidence_cache.py
      - src/physical_fpv/validation.py
      - requirements-lock.txt
      - pyproject.toml
      - docs/benchmarks/grid120-verified-evidence.json
      - docs/benchmarks/thermal-representative-grid80.json
      - docs/benchmarks/thermal-grid80-reference.csv
      - docs/benchmarks/thermal-reference-manifest.json
      - .github/workflows/thermal-grid.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thermal-grid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  grid80-to120:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned research environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Verify calculation fingerprints before reusing evidence
        id: saved
        run: python scripts/grid_evidence_cache.py --out results/grid120 --github-output "$GITHUB_OUTPUT"
      - name: Run one unchanged-state grid120 case with 20-minute budget
        if: steps.saved.outputs.reuse != 'true'
        run: python scripts/verify_thermal_grid.py --mesh 120 --timeout 1200 --out results/grid120
      - name: Check representative numerical targets
        run: |
          python -c "import json; r=json.load(open('results/grid120/comparison.json')); print(json.dumps(r,indent=2)); assert r['passed'], 'Representative numerical gate failed; physical parameters and thresholds are unchanged'"
      - name: Publish exact outcome and scope
        if: always()
        run: |
          echo '## One-case 80 to 120 numerical check' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not establish whole-cohort convergence or repair the 30/36 empirical failures.' >> "$GITHUB_STEP_SUMMARY"
          for name in status comparison; do
            if test -f results/grid120/$name.json; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat results/grid120/$name.json >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Add portable source attribution
        if: always()
        run: python -c "from physical_fpv.attribution import write_evidence_attribution; write_evidence_attribution('results/grid120', ['tec_validation', 'oregan2022_parameters'])"
      - name: Preserve numerical evidence, including budget failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: representative-thermal-grid-evidence
          path: results/grid120/
          if-no-files-found: warn
          retention-days: 14
