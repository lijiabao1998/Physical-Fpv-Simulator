name: Player verification and Pages
on:
  pull_request:
    paths: ['web/**', 'reference/**', '.github/workflows/player.yml']
  push:
    branches: [main, 'game/**']
    paths: ['web/**', 'reference/**', '.github/workflows/player.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: npm ci
      - run: npm run reference
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-verification-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
            web/numerical-results/
            web/dist/version.json
            docs/game-v0.1/evidence/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public commit provenance over HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --proto '=https' "${PAGE_URL%/}/version.json?sha=${EXPECTED_SHA}" -o version.json && python3 -c 'import json,os; v=json.load(open("version.json")); assert v["commit"]==os.environ["EXPECTED_SHA"] and v["dirty"] is False'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
