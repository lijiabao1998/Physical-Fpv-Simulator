name: Battery research checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Fetch checksum-pinned public data
        run: |
          physical-fpv fetch-data
          physical-fpv thermal-fetch-data
          physical-fpv thermal-inspect
      - name: Unit and physical-invariant tests
        run: pytest -q
      - name: Record full DFN numerical and empirical benchmark
        run: |
          physical-fpv benchmark --out results/dfn
          cat results/dfn/report.md >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; r=json.load(open('results/dfn/report.json')); assert r['numerical_gate_passed'], 'Numerical gate failed'"
      - name: Verify analytical materials method
        run: physical-fpv material-method-check > results/material-method.json
      - name: Upload reproducible research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery-research-evidence
          path: results/
          if-no-files-found: warn
          retention-days: 14

