name: Stanford external measurement pilot
on:
  pull_request:
    paths:
      - src/physical_fpv/core.py
      - src/physical_fpv/current_profile.py
      - src/physical_fpv/stanford_benchmark.py
      - src/physical_fpv/stanford_data.py
      - src/physical_fpv/stanford_reference.py
      - src/physical_fpv/thermal_benchmark.py
      - src/physical_fpv/validation.py
      - scripts/run_stanford_pilot.py
      - docs/stanford-validation-protocol.md
      - docs/stanford-scheduling-addendum.md
      - docs/stanford-memory-addendum.md
      - docs/benchmarks/stanford-k1-mesh80-reference.json
      - docs/benchmarks/stanford-k1-mesh80-v2.csv.gz
      - docs/benchmarks/stanford-k1-mesh80-v2.json
      - data/stanford-manifest.json
      - docs/benchmarks/stanford-k1-chronology.json
      - requirements-lock.txt
      - requirements-data-lock.txt
      - pyproject.toml
      - .github/workflows/stanford-pilot.yml
      - scripts/stanford_evidence_cache.py
      - docs/benchmarks/stanford-k1-v3-verified-evidence.json
      - docs/benchmarks/stanford-k1-current-source-20261009-evidence.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stanford-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  one-external-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYBAMM_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "1"
      PHYSICAL_FPV_RESEARCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-data-lock.txt
      - name: Install pinned research environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-data-lock.txt
      - name: Verify calculation fingerprints before reusing the recorded attempt
        id: saved
        run: python scripts/stanford_evidence_cache.py --github-output "$GITHUB_OUTPUT"
      - name: Fail closed when changed calculations need a separately reviewed solve
        if: steps.saved.outputs.reuse != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo 'Scientific validation UNVERIFIED: calculation fingerprints changed.'
          echo 'Historical evidence remains tied to its original commit. No new solve was launched.'
          echo 'A separately reviewed bounded protocol must be explicitly dispatched.'
          exit 1
      - name: Acquire the checksum-pinned source pilot
        if: steps.saved.outputs.reuse != 'true' && github.event_name == 'workflow_dispatch'
        run: python scripts/inspect_stanford_pilot.py --fetch
      - name: Complete only mesh120 within twenty minutes and reuse the authenticated mesh80 result
        if: steps.saved.outputs.reuse != 'true' && github.event_name == 'workflow_dispatch'
        run: python scripts/run_stanford_pilot.py --timeout 1200
      - name: Keep incomplete reused execution distinct from scientific disagreement
        if: steps.saved.outputs.reuse == 'true'
        run: |
          python -c "import json; r=json.load(open('results/stanford-k1-pilot/status.json')); assert r['status']=='completed', 'Recorded solver/budget failure remains unverified; no new simulation was run'"
      - name: Report numerical and empirical outcomes separately
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('results/stanford-k1-pilot/report.json')
          status=Path('results/stanford-k1-pilot/status.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('One external k1 pilot. No parameter fitting; ORegan30/36 failures remain.\n\n')
              if status.exists(): out.write(json.dumps(json.loads(status.read_text()),indent=2)+'\n\n')
              if path.exists():
                  r=json.loads(path.read_text())
                  out.write('Electrical empirical gate: '+str(r['electrical_pilot_gates_passed'])+'\n\n')
                  out.write('Spatial numerical check: '+str(r['spatial_numerical_check']['passed'])+'\n\n')
              out.write('Stanford cooling coefficient is unspecified; surface-versus-average temperature is a proxy, not independent thermal validation.\n')
          PY
      - name: Preserve complete and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stanford-k1-pilot-evidence
          path: results/
          if-no-files-found: warn
          retention-days: 14
